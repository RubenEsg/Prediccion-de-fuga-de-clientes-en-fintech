# Jupyter Book de las tres entregas. Las páginas son cuadernos ya ejecutados: el libro se construye con
# sus salidas guardadas (execute_notebooks: off) y no necesita los datos.
title: "Predicción de fuga de clientes en una fintech colombiana"
author: "Martínez Pulido Valerie · Basto Martínez Abrahan · Esguerra Fernández Rubén"
copyright: "2026"
logo: ""

execute:
  execute_notebooks: "off"

only_build_toc_files: true

exclude_patterns:
  - _build
  - docs
  - datos
  - "**/tests"
  - "**/resultados"
  - "**/articulo"
  - "**/presentacion"
  - "**/fuentes"

repository:
  url: https://github.com/RubenEsg/Prediccion-de-fuga-de-clientes-en-fintech
  branch: main

html:
  use_issues_button: false
  use_repository_button: true
  use_edit_page_button: false

sphinx:
  config:
    language: es
    html_css_files:
      - custom.css
    html_theme_options:
      show_navbar_depth: 1
      navigation_with_keys: false

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
